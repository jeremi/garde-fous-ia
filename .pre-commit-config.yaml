repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (règles du projet)
        entry: uvx semgrep@1.178.0 scan --config .semgrep/regles.yml --error --metrics=off --quiet
        language: system
        pass_filenames: false
        files: ^app/
